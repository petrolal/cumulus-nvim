name: CI

# Runs the validation apparatus that already lives in this repo -- stylua,
# shell-syntax checks, the plenary busted suite (lua/tetravim/tests/) and the
# scripts/validate.sh orchestrator -- on every push to main and every PR, so a
# regression is caught here instead of the next time someone runs validate.sh
# by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Fast, Neovim-free static checks. Fails the build on formatting drift or a
  # non-parseable shell script.
  # --------------------------------------------------------------------------
  lint:
    name: Lint (stylua + shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ github.token }}
          version: latest
          # Config comes from ./stylua.toml (2-space, 120 col).
          args: --check .

      - name: Shell syntax (bash -n)
        run: |
          bash -n bootstrap.sh

      - name: shellcheck (advisory, non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bootstrap.sh || true

  # --------------------------------------------------------------------------
  # The plenary busted spec suite (lua/tetravim/tests/*_spec.lua). "stable" is
  # the gate; "nightly" is an early-warning canary and is allowed to fail.
  # --------------------------------------------------------------------------
  test:
    name: Busted specs (nvim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (${{ matrix.neovim }})
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Cache Neovim data/state
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim
            ~/.local/state/nvim
          key: nvim-test-${{ matrix.neovim }}-${{ hashFiles('lazy-lock.json') }}-v1
          restore-keys: |
            nvim-test-${{ matrix.neovim }}-

      - name: Link Neovim config
        run: |
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}"
          ln -sf "$GITHUB_WORKSPACE" "${XDG_CONFIG_HOME:-$HOME/.config}/nvim"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Sync plugins
        run: nvim --headless -u init.lua "+Lazy! sync" +qa

      - name: Install Tree-sitter parsers
        run: |
          nvim --headless -u init.lua \
            -c "Lazy! load nvim-treesitter" \
            -c "lua local t = require('nvim-treesitter').install({ 'java', 'kotlin', 'scala', 'lua', 'regex' }); if t and t.wait then t:wait(120000) end" \
            -c "qa!"

      - name: Run plenary busted suite
        run: |
          set -o pipefail
          nvim --headless -u init.lua \
            -c "Lazy! load plenary.nvim" \
            -c "PlenaryBustedDirectory lua/tetravim/tests/" \
            -c "qa" 2>&1 | sed -r 's/\x1b\[[0-9;]*m//g' | tee busted.log

          # PlenaryBustedDirectory's headless exit code is unreliable across
          # plenary versions, so gate on the printed summary instead: any
          # non-zero "Failed :" / "Errors :" count is a failure, and a run
          # that produced no "Success" line at all means the suite never
          # executed (e.g. a load error) and must also fail.
          if grep -Eq '^(Failed|Errors) :[[:space:]]+[1-9]' busted.log; then
            echo "::error::busted reported failing specs"
            exit 1
          fi
          if ! grep -Eq '^Success:?[[:space:]]' busted.log; then
            echo "::error::busted produced no summary -- the suite did not run"
            exit 1
          fi

      - name: Upload busted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: busted-log-${{ matrix.neovim }}
          path: busted.log
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Native headless setup & provisioning smoke test (tetravim.core.setup)
  # --------------------------------------------------------------------------
  smoke:
    name: Native Setup & Provisioning Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Cache Neovim data/state
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim
            ~/.local/state/nvim
          key: nvim-smoke-${{ hashFiles('lazy-lock.json') }}-v1
          restore-keys: |
            nvim-smoke-

      - name: Link Neovim config
        run: |
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}"
          ln -sf "$GITHUB_WORKSPACE" "${XDG_CONFIG_HOME:-$HOME/.config}/nvim"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Native headless provisioning (tetravim.core.setup)
        run: nvim --headless -u init.lua -c "lua require('tetravim.core.setup').run()" -c "qa!"

      - name: Verify health snapshot
        run: nvim --headless -u init.lua -c "lua io.write(require('tetravim.core.health').json() .. '\n')" -c "qa!"

